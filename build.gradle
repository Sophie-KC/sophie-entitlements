plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'org.sophie'
// Same DECLARED_VERSION / release-tag convention as sophie-protos.
ext.DECLARED_VERSION = '0.2.4'
version = project.findProperty('releaseVersion') ?: DECLARED_VERSION
description = 'sophie-entitlements — Spring Boot starter wrapping subscription-service entitlement checks'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenLocal()
    maven {
        name = 'GitHubPackages'
        url = uri("https://maven.pkg.github.com/${project.findProperty('gpr.owner') ?: 'Sophie-KC'}/sophie-protos")
        credentials {
            username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
            password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
        }
    }
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
    }
}

dependencies {
    // Exported: any consumer needs the generated stubs to reference EntitlementServiceGrpc etc.
    api 'org.sophie:sophie-protos:0.27.0'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    // Client-only: this library only ever consumes EntitlementServiceGrpc's blocking stub, it never
    // implements a @GrpcService. The combined grpc-spring-boot-starter auto-starts an embedded gRPC
    // server (default port 9090) in EVERY consuming app, including gRPC-server-less apps like
    // api-gateway — collided with org-service's real 9090 in api-gateway's test suite.
    implementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'org.slf4j:slf4j-api'
    // Near-cache (§3.2 of the master prompt) and its fanout-exchange invalidation listener (Phase 2
    // §0.3) — both belong in the shared library, not each consuming service, so nothing forgets to
    // wire the listener and serves stale entitlements with no symptom.
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Test-only: CacheInvalidationListenerIntegrationTest stands up an in-process fake
    // EntitlementService (@GrpcService) to test the near-cache invalidation listener. Main code stays
    // client-only (see the implementation dependency above) — this must never leak into consumers.
    testImplementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('printVersion') {
    doLast { println DECLARED_VERSION }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${project.findProperty('gpr.owner') ?: 'Sophie-KC'}/sophie-entitlements")
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
