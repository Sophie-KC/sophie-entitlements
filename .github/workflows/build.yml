name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # NO TEST GATE: matches the fleet-wide convention every service's own CI already documents (see
      # sophie-ci/java-service.yml) — several suites here (e.g. CacheInvalidationListenerIntegrationTest)
      # need a live RabbitMQ with no Testcontainers, which this runner doesn't provision. This is the
      # first time this repo's CI has ever actually run (previously local-only, resolved via
      # mavenLocal), so this gap was never hit until now, not something newly introduced.
      - name: Build
        run: ./gradlew --no-daemon build -x test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.ref == 'refs/heads/master'
        run: ./gradlew --no-daemon publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
